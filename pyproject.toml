[build-system]
requires = ["setuptools", "wheel", "nanobind", "cmake"]
build-backend = "setuptools.build_meta"

# Note: nanobind is used for Python bindings (pybind11 support removed).
# 
# Usage:
#   python -m pip install -e . --no-build-isolation
# 
# Note: Use --no-build-isolation to ensure CMake can find conda-installed
#       C++ dependencies (e.g., tsl-robin-map).

[project]
name = "polyfempy"
version = "0.8"
description="Polyfem Python Bindings"
readme = "README.md"
authors = [
  { name = "Zizhou Huang", email = "zizhou@nyu.edu" },
]
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]

[project.optional-dependencies]
differentiable = [
    "torch>=1.9.0",
]
nanobind = [
    "nanobind>=2.0.0",
]
all = [
    "torch>=1.9.0",
    "nanobind>=2.0.0",
]