[build-system]
requires = ["setuptools>=77", "wheel", "nanobind>=2.0.0", "cmake>=3.25"]
build-backend = "setuptools.build_meta"

# Note: nanobind is used for Python bindings (pybind11 support removed).
# 
# Usage:
#   python -m pip install -e . --no-build-isolation
# 
# Note: Use --no-build-isolation to ensure CMake can find conda-installed
#       C++ dependencies (e.g., tsl-robin-map).

[project]
name = "polyfempy"
version = "0.8"
description = "PolyFEM Python bindings"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Zizhou Huang", email = "zizhou@nyu.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
io = [
    "meshio>=5.0.0",
]
differentiable = [
    "torch>=2.0.0",
]
visualization = [
    "matplotlib>=3.5",
]
dev = [
    "pytest>=7.0",
]
test = [
    "pytest>=7.0",
]
all = [
    "matplotlib>=3.5",
    "meshio>=5.0.0",
    "pytest>=7.0",
    "torch>=2.0.0",
]

[project.scripts]
polyfempy = "polyfempy.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["polyfempy*"]
exclude = ["src*", "experiment*", "docs*", "examples*", "data*", "cmake*"]
