name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (py${{ matrix.python-version }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      # polyfempy/generated_api is intentionally ignored in git, so CI must
      # regenerate it before importing the public generated API.
      - name: Generate packaged API
        run: python tools/generate_polyfem_api.py

      # Do not run `pip install -e .` here: it compiles the C++ backend.
      # This workflow is the backend-free Python/generator test gate.
      - name: Run tests
        run: python -m pytest tests -q
