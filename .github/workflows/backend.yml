name: Backend

on:
  workflow_dispatch:
    inputs:
      run_generated_example_diagnostic:
        description: Run one slow generated example vs source JSON backend diagnostic
        required: false
        default: false
        type: boolean

jobs:
  backend:
    runs-on: ubuntu-latest
    name: ubuntu-latest (py3.11 backend)
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cmake nanobind numpy pytest

      - name: Generate packaged API
        run: python tools/generate_polyfem_api.py

      - name: Build editable backend
        run: python -m pip install -e . --no-build-isolation -vv

      - name: Check compiled backend
        run: python -m polyfempy backend-info --require

      - name: Run backend smoke test
        run: python -m pytest tests/test_backend_smoke.py -q -rs

      - name: Run generated example backend diagnostic
        if: ${{ inputs.run_generated_example_diagnostic }}
        run: |
          python tools/check_generated_example_backend.py \
            --example examples/classic_example/2D/contact_2d_golf_ball_deformable_wall_generated_api.py \
            --source-json polyfem-data/contact/examples/2D/golf-ball-doformable-wall.json \
            --output-root build/generated-example-backend-check
